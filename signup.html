<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お知らせを受け取る | Life Alignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2FBF9;
            --surface: #FFFFFF;
            --ink: #102E3A;
            --text: #102E3A;
            --muted: #64747B;
            --line: #DCEAE8;
            --accent: #22B8AE;
            --accent-dark: #138E8A;
            --accent-soft: #DDF7F2;
            --gradient-brand: linear-gradient(180deg, #48CFC3 0%, #2EBFB4 58%, #20AFA6 100%);
            --shadow-card: 0 10px 30px rgba(20, 89, 86, 0.06), 0 2px 8px rgba(20, 89, 86, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 10%, rgba(97, 213, 197, 0.1), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: min(100%, 620px);
            padding: clamp(28px, 6vw, 48px);
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: var(--shadow-card);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .brand::before {
            content: "";
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: inset 0 0 0 5px #fff;
            background: var(--accent-dark);
        }

        h1 {
            margin: 0 0 14px;
            color: var(--ink);
            font-family: "Noto Sans JP", "Inter", sans-serif;
            font-size: clamp(28px, 7vw, 42px);
            line-height: 1.35;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 16px;
            margin-top: 30px;
        }

        label {
            display: grid;
            gap: 8px;
            color: var(--ink);
            font-weight: 700;
        }

        input[type="email"] {
            width: 100%;
            min-height: 54px;
            padding: 0 18px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #FFFFFF;
            color: var(--ink);
            font: inherit;
        }

        input[type="email"]:focus {
            outline: 3px solid rgba(97, 213, 197, 0.28);
            border-color: var(--accent);
        }

        .consent {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 10px;
            align-items: start;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .consent input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            margin-top: 4px;
        }

        button {
            min-height: 56px;
            border: none;
            border-radius: 999px;
            background: var(--gradient-brand);
            color: #FFFFFF;
            font-family: "Noto Sans JP", "Inter", sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 184, 174, 0.2);
        }

        .fineprint {
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .fineprint a,
        .back-link {
            color: var(--accent-dark);
            font-weight: 700;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--ink);
            font-weight: 700;
        }

        .back-link {
            display: inline-flex;
            margin-top: 28px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">LIFE ALIGNMENT</div>
        <h1>お知らせを受け取る</h1>
        <p>詳細診断やアップデートがリリースされたら、メールでお知らせします。</p>

        <form id="signupForm">
            <label>
                メールアドレス
                <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            </label>
            <label class="consent">
                <input type="checkbox" required>
                <span>Life Alignment からのお知らせメールを受け取ることに同意します。いつでも配信停止できます。</span>
            </label>
            <button type="submit">登録する</button>
        </form>

        <p class="message" id="successMessage">登録ありがとうございます。お知らせの準備ができたらご連絡します。</p>
        <p class="fineprint">ご入力いただく情報の取り扱いについては、<a href="privacy.html">プライバシーポリシー</a>をご確認ください。</p>
        <a class="back-link" href="index.html">診断ページに戻る</a>
    </main>

    <script>
        const SIGNUP_ENDPOINT = '';
        const SIGNUP_NOTIFY_EMAIL = 'nnsh774@gmail.com';

        document.getElementById('signupForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const submitButton = form.querySelector('button');
            const message = document.getElementById('successMessage');
            const email = new FormData(form).get('email');

            submitButton.disabled = true;
            message.style.display = 'block';
            message.textContent = '登録しています...';
            localStorage.setItem('lifeAlignmentSignupEmail', email);

            if (!SIGNUP_ENDPOINT) {
                message.textContent = '登録先の設定後に送信されます。';
                submitButton.disabled = false;
                return;
            }

            try {
                await fetch(SIGNUP_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: new URLSearchParams({
                        email,
                        notifyEmail: SIGNUP_NOTIFY_EMAIL,
                        source: 'life-alignment-signup',
                        pageUrl: window.location.href,
                        submittedAt: new Date().toISOString()
                    })
                });
                message.textContent = '登録ありがとうございます。お知らせの準備ができたらご連絡します。';
                form.reset();
            } catch (error) {
                message.textContent = '送信できませんでした。少し時間をおいて再度お試しください。';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
